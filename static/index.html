<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MBBS Revision — Active Recall Study App</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="favicon-256.png" />
  <!-- Installable app (PWA): manifest + theme colour + iOS home-screen hints.
       The service worker behind this keeps studied lessons readable offline. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MBBS Revision" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- KaTeX renders the LaTeX formulas the AI writes ($...$ / $$...$$). Served
       locally so the app keeps working offline. -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">🩺</div>
        <div class="brand-text">
          <div class="brand-title">MBBS Revision</div>
          <div class="brand-sub">Active Recall · Spaced Repetition</div>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item" data-view="dashboard">
          <span class="nav-ico">📊</span><span>总览</span>
        </button>
        <button class="nav-item" data-view="lessons">
          <span class="nav-ico">📚</span><span>课程</span>
        </button>
        <button class="nav-item" data-view="nav">
          <span class="nav-ico">📖</span><span>知识导航</span>
        </button>
        <button class="nav-item" data-view="review">
          <span class="nav-ico">🎯</span><span>今日学习</span>
          <span class="badge" id="review-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="mistakes">
          <span class="nav-ico">📕</span><span>错题</span>
          <span class="badge badge-red" id="mistake-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="favs">
          <span class="nav-ico">⭐</span><span>收藏题目</span>
          <span class="badge" id="fav-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="progress">
          <span class="nav-ico">📈</span><span>进度</span>
        </button>
        <button class="nav-item" data-view="formulas">
          <span class="nav-ico">📐</span><span>公式库</span>
        </button>
        <button class="nav-item" data-view="token">
          <span class="nav-ico">🔢</span><span>Token 统计</span>
        </button>
        <button class="nav-item" data-view="search">
          <span class="nav-ico">🔍</span><span>搜索</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-ico">⚙️</span><span>设置</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="ai-status" class="ai-status">AI: checking…</div>
        <button id="btn-logout" class="nav-item" style="margin-top:8px;width:100%">🚪 退出登录</button>
      </div>
    </aside>
    <main id="main">
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast-wrap"></div>
  <div id="modal-root"></div>
  <div id="pet" title="点我说话，拖我移动">
    <div id="pet-timer">
      <div id="pet-today">📚 <span id="pet-today-val">0m</span> / <span id="pet-goal-val">30m</span></div>
      <button id="pet-pomo-btn" class="btn btn-sm btn-ghost" type="button" title="设置/开始专注计时">🎯 专注 25:00</button>
    </div>
    <img src="img/pet.png" alt="desk pet">
  </div>
  <!-- Outside #pet on purpose: hiding the pet must not hide the way to bring it
       back (and the × also doubles as "restore" once the pet is collapsed). -->
  <button id="pet-hide" type="button" title="收起/显示宠物">×</button>
  <div id="pet-pomo-mini" title="点击设置/开始专注计时">🎯 专注</div>
  <!-- html2pdf (~900 KB) is fetched on the first PDF export instead of here: it is
       by far the heaviest script on the page and most visits never export one. -->
  <!-- Loaded before the app modules: markdown.js reads window.katex. -->
  <script src="vendor/katex/katex.min.js"></script>
  <!-- Plain script, loaded first: registers the service worker and the install
       button. Independent of the app module so a browser without support is
       unaffected. -->
  <script src="js/pwa.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { initFeatureLauncher } from "./js/features/launcher.js";
    initFeatureLauncher();
  </script>
</body>
</html>
