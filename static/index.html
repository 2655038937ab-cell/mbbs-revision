<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MBBS Revision — Active Recall Study App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">🩺</div>
        <div class="brand-text">
          <div class="brand-title">MBBS Revision</div>
          <div class="brand-sub">Active Recall · Spaced Repetition</div>
        </div>
      </div>
      <nav id="nav">
        <button class="nav-item" data-view="dashboard">
          <span class="nav-ico">📊</span><span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="lessons">
          <span class="nav-ico">📚</span><span>Lessons</span>
        </button>
        <button class="nav-item" data-view="review">
          <span class="nav-ico">🔁</span><span>Review</span>
          <span class="badge" id="review-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="mistakes">
          <span class="nav-ico">📕</span><span>Mistakes</span>
          <span class="badge badge-red" id="mistake-badge" hidden>0</span>
        </button>
        <button class="nav-item" data-view="progress">
          <span class="nav-ico">📈</span><span>Progress</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-ico">⚙️</span><span>Settings</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div id="ai-status" class="ai-status">AI: checking…</div>
        <button id="btn-logout" class="nav-item" style="margin-top:8px;width:100%">🚪 Log out</button>
      </div>
    </aside>
    <main id="main">
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast-wrap"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
